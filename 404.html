<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f3fb" id="theme-color" />
    <title>Page not found — Laurence Walshe</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <script>
      const savedTheme = localStorage.getItem('laurencewalshe-theme');
      const theme = savedTheme || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'forest' : 'lavender');
      document.documentElement.dataset.theme = theme;
      document.getElementById('theme-color').content = theme === 'forest' ? '#12352b' : '#f7f3fb';
    </script>
    <link rel="stylesheet" href="styles.css" />
    <style>
      .missing { min-height:calc(100vh - 160px); display:grid; place-content:center; text-align:center; }
      .missing h1 { margin:.5rem 0 1rem; font-size:clamp(3rem,10vw,8rem); line-height:.9; letter-spacing:-.09em; }
      .missing p { margin:0 auto 2rem; max-width:32rem; line-height:1.6; }
    </style>
  </head>
  <body>
    <div class="page-noise" aria-hidden="true"></div>
    <header class="site-header"><a class="wordmark" href="/" aria-label="Laurence Walshe home">LW<span>.</span></a></header>
    <main class="missing">
      <p class="eyebrow">404</p>
      <h1>Lost in the<br><em>system.</em></h1>
      <p>That page is not here, but the rest of the site is.</p>
      <a class="button" href="/">Back home <span aria-hidden="true">↗</span></a>
    </main>
  </body>
</html>
